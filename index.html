<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SLS - SOUNDSCAPE LIVE SAMPLER</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#e9eee8;--ink:#1c2a29;--mute:#5d6f6c;--card:#f7faf6;--line:#c3cfc9;--acc:#1f6f64;--rec:#d63b2f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101b1a;--ink:#e4eeea;--mute:#8fa5a0;--card:#1a2927;--line:#334743;--acc:#5cc4b3;--rec:#ff6a5c}}
:root[data-theme="dark"]{--bg:#101b1a;--ink:#e4eeea;--mute:#8fa5a0;--card:#1a2927;--line:#334743;--acc:#5cc4b3;--rec:#ff6a5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Familjen Grotesk",system-ui,sans-serif;display:flex;flex-direction:column;gap:10px;padding:12px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px}
.brand{order:2;flex:none;display:flex;flex-direction:column;align-items:stretch;gap:3px}
#mini{width:100%;height:14px;background:none;border-radius:0}
h1{text-align:center;font-size:1.35rem;margin:0;font-weight:700;letter-spacing:.08em;background:var(--acc);color:var(--bg);padding:3px 14px;border-radius:10px}
.modes{order:1;display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.modes button{border:0;background:none;color:var(--mute);font:inherit;font-weight:700;padding:8px 10px}
.modes button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.modes button.r[aria-pressed=true]{background:var(--rec);color:#fff}
#msg{min-height:1.3em;font-size:.9rem;color:var(--mute);margin:0}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:10px}
@media (orientation:landscape){#grid{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr)}}
.pad{position:relative;scroll-margin-bottom:calc(var(--sheet-h,0px) + 16px);border-radius:18px;border:2px dashed var(--line);background:transparent;color:var(--mute);font:inherit;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;min-height:0}
.pad.full{border:0;background:hsl(var(--h) 52% 52%);color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18);transition:filter .15s}
.pad.full:not(.on){filter:grayscale(1) brightness(.82)}
.pad small{font-weight:500;opacity:.85}
.pad .wf{position:absolute;left:10%;top:12%;width:80%;height:56%;background:none;border-radius:0;pointer-events:none}
.pad.full small{position:absolute;bottom:8%;left:0;right:0;text-align:center;font-size:.8rem;opacity:.95;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.pad.on{filter:brightness(1.25);transform:scale(.97)}
.pad.rec{border:2px solid var(--rec);color:var(--rec);animation:pulse 1s infinite}
.pad.sel{outline:3px solid var(--ink);outline-offset:2px}
.wv{position:relative}
#head{position:absolute;top:0;bottom:0;left:0;width:2px;margin-left:-1px;background:var(--rec);box-shadow:0 0 6px var(--rec);display:none;pointer-events:none}
body.editing{height:auto;min-height:100%;overflow-y:auto;padding-bottom:calc(var(--sheet-h,0px) + 12px)}
body.editing #grid{flex:none;grid-template-rows:repeat(4,104px)}
@media (orientation:landscape){body.editing #grid{grid-template-rows:repeat(3,104px)}}
body.editing .pad:not(.sel){opacity:.5}
body.editing .pad.sel{outline:4px solid var(--ink);outline-offset:3px;transform:scale(1.04);z-index:1}
@keyframes pulse{50%{background:color-mix(in srgb,var(--rec) 18%,transparent)}}
@media (prefers-reduced-motion:reduce){.pad.rec{animation:none;background:color-mix(in srgb,var(--rec) 18%,transparent)}}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.28);display:none;flex-direction:column;gap:8px;overflow:hidden}
@media (orientation:landscape){#sheet{overflow-y:auto;max-height:75%}}
#sheet.open{display:flex}
canvas{width:100%;height:80px;border-radius:10px;background:var(--bg)}
.row{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px;font-size:.9rem;height:30px}
input[type=range]{width:100%;accent-color:var(--acc)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns button{flex:1;min-width:30%;font:inherit;font-weight:700;padding:9px 8px;border-radius:12px;border:1.5px solid var(--line);background:none;color:var(--ink)}
.btns button[aria-pressed=true]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.btns .del{color:var(--rec);border-color:var(--rec)}
.btns .ok{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;font:inherit;font-weight:700;padding:8px;border-radius:10px;border:1.5px solid var(--line);background:none;color:var(--mute)}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#tabSom,#tabEq{display:flex;flex-direction:column;gap:8px;height:216px}
#wave{height:140px;touch-action:none;cursor:ew-resize}
#tabSom[hidden],#tabEq[hidden]{display:none}
#fft{flex:1;min-height:0;height:auto;touch-action:none;cursor:ns-resize}

.eqrow{display:flex;gap:6px}
.eqrow button{flex:1;min-width:0;font:inherit;font-weight:700;font-size:.72rem;padding:8px 1px;border-radius:10px;border:1.5px solid var(--line);background:none;color:var(--mute)}
.eqrow button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
#bEq0{color:var(--ink)}
#bType{border-color:var(--c);color:var(--c)}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
#dlg.show{display:flex}
#dlg .box{background:var(--card);color:var(--ink);border-radius:20px;padding:20px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:8px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#dlg p{margin:0;font-size:1.1rem;font-weight:700}
#dlg small{color:var(--mute);font-size:.9rem}
.dbtn{display:flex;gap:10px;margin-top:8px}
.dbtn button{flex:1;font:inherit;font-weight:700;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:none;color:var(--ink)}
.dbtn #dYes{background:var(--rec);border-color:var(--rec);color:#fff}
#map{display:none;flex:1;min-height:0;position:relative;border-radius:22px;border:1.5px solid var(--line);background:radial-gradient(ellipse at center,var(--card),var(--bg));overflow:hidden;touch-action:none;color:var(--ink)}
body.maping #map{display:block}
body.maping #grid{display:none}
#map .rings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#map .rings ellipse{fill:none;stroke:var(--line);stroke-dasharray:4 6}
#me{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;pointer-events:none}
.dot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:hsl(var(--h) 52% 52%);filter:grayscale(1) brightness(.82);display:flex;align-items:center;justify-content:center;pointer-events:none;transition:filter .15s}
.dot.lit{filter:none}
.dot canvas{width:28px;height:15px;background:none;border-radius:0}
.dot svg{position:absolute;left:-26px;top:-26px;width:96px;height:96px;transform:rotate(-90deg);overflow:visible}
.dot .rg{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-dasharray:277;stroke-dashoffset:277;opacity:0}
.dot.hold .rg{opacity:1;animation:fill .85s linear forwards}
.dot.grab{box-shadow:0 0 0 4px var(--ink),0 0 0 14px color-mix(in srgb,var(--ink) 20%,transparent)}
@keyframes fill{to{stroke-dashoffset:0}}
.fing{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--ink);opacity:.6;pointer-events:none}
#rot{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;background:var(--bg);font-weight:700}

</style>
</head>
<body>
<header>
  <div class="brand"><h1 aria-label="SLS - Soundscape Live Sampler">SLS</h1><canvas id="mini" aria-hidden="true"></canvas></div>
  <div class="modes" role="group" aria-label="Modo">
    <button data-m="play" aria-pressed="true">Tocar</button>
    <button data-m="rec" class="r" aria-pressed="false">Gravar</button>
    <button data-m="edit" aria-pressed="false">Editar</button>
    <button data-m="map" aria-pressed="false">Mapa</button>
  </div>
</header>
<p id="msg">A carregar sons de teste…</p>
<main id="grid"></main>
<section id="map" aria-label="Mapa sonoro">
  <svg class="rings" aria-hidden="true"><ellipse cx="50%" cy="50%" rx="25%" ry="25%"/><ellipse cx="50%" cy="50%" rx="50%" ry="50%"/><ellipse cx="50%" cy="50%" rx="75%" ry="75%"/></svg>
  <svg id="me" viewBox="0 0 60 60" aria-label="Ouvinte"><path d="M25 21L30 11L35 21Z" fill="currentColor"/><circle cx="30" cy="34" r="12" fill="none" stroke="currentColor" stroke-width="3"/><path d="M15 34A15 15 0 0 1 45 34" fill="none" stroke="currentColor" stroke-width="3.5"/><rect x="10" y="31" width="8" height="14" rx="3" fill="currentColor"/><rect x="42" y="31" width="8" height="14" rx="3" fill="currentColor"/></svg>
  
</section>
<div id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dt"><div class="box"><p id="dt">Apagar este som?</p><small>O som e as suas edições são removidos.</small><div class="dbtn"><button id="dNo">Cancelar</button><button id="dYes">Apagar</button></div></div></div>

<section id="sheet" aria-label="Editar som">
  <div class="tabs" role="group" aria-label="Separador"><button data-t="som" aria-pressed="true">Som</button><button data-t="eq" aria-pressed="false">EQ</button></div>
  <div id="tabSom"><div class="wv"><canvas id="wave"></canvas><i id="head"></i></div>
  
  
  <div class="row"><label for="v">Volume</label><input id="v" type="range" min="0" max="150"></div>
  <div class="row"><label for="r">Velocidade</label><input id="r" type="range" min="25" max="200"></div></div>
  <div id="tabEq" hidden>
    <canvas id="fft"></canvas>
    <div class="eqrow"><button class="bn" aria-pressed="true">120 Hz</button><button class="bn" aria-pressed="true">600 Hz</button><button class="bn" aria-pressed="true">2,5 kHz</button><button class="bn" aria-pressed="true">8 kHz</button><button id="bType">Shelf</button><button id="bEq0">Repor</button></div>
  </div>
  <div class="btns">
    <button id="bRev" aria-pressed="false">Inverter</button>
    <button id="bLoop" aria-pressed="false">Repetir</button>
    <button id="bLatch" aria-pressed="true">Latch</button>
    <button id="bPlay">Ouvir</button>
    <button id="bDel" class="del">Apagar</button>
    <button id="bOk" class="ok">Fechar</button>
  </div>
</section>

<script>
const N=12, MAX=20;
const $=s=>document.querySelector(s);
const grid=$('#grid'), msg=$('#msg'), sheet=$('#sheet'), wave=$('#wave');
let mode='play', ctx=null, db=null, sel=-1, rec=null;
const pads=Array.from({length:N},()=>null);
const active={};
const els=[];

const say=t=>{msg.textContent=t};
const fmt=s=>s.toFixed(1).replace('.',',')+' s';

/* ---------- storage ---------- */
function openDB(){return new Promise(res=>{
  try{const q=indexedDB.open('paisagem-sonora',1);
    q.onupgradeneeded=()=>q.result.createObjectStore('pads',{keyPath:'id'});
    q.onsuccess=()=>{db=q.result;res()};q.onerror=()=>res();
  }catch(e){res()}});}
function dbPut(i){const p=pads[i];if(!db||!p||!p.blob)return;
  try{db.transaction('pads','readwrite').objectStore('pads').put({id:i,blob:p.blob,start:p.start,end:p.end,vol:p.vol,rate:p.rate,reverse:p.reverse,loop:p.loop,latch:p.latch,eq:p.eq,eqf:p.eqf,eqo:p.eqo,eqq:p.eqq,eqt:p.eqt,mx:p.mx,my:p.my});}catch(e){}}
function dbDel(i){if(!db)return;try{db.transaction('pads','readwrite').objectStore('pads').delete(i)}catch(e){}}
function dbAll(){return new Promise(res=>{if(!db)return res([]);
  try{const q=db.transaction('pads').objectStore('pads').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([]);}catch(e){res([])}});}
let saveT;const saveSoon=i=>{clearTimeout(saveT);saveT=setTimeout(()=>dbPut(i),300)};

/* ---------- audio ---------- */
function ac(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function reverseBuf(b){const o=ac().createBuffer(b.numberOfChannels,b.length,b.sampleRate);
  for(let c=0;c<b.numberOfChannels;c++){const a=b.getChannelData(c),d=o.getChannelData(c);for(let i=0;i<a.length;i++)d[i]=a[a.length-1-i]}return o}
async function makePad(blob,o={}){
  const buf=await ac().decodeAudioData(await blob.arrayBuffer());
  const p={blob,buf,rev:null,start:0,end:1,vol:1,rate:1,reverse:false,loop:false,...o};
  p.latch=p.latch!==false;p.eq=p.eq||[0,0,0,0];p.eqf=p.eqf||[120,600,2500,8000];p.eqo=p.eqo||[true,true,true,true];p.eqq=p.eqq||[1,1,1,1];p.eqt=p.eqt||['shelf','bell','bell','shelf'];if(p.reverse)p.rev=reverseBuf(buf);return p;}
const curBuf=p=>p.reverse?(p.rev||(p.rev=reverseBuf(p.buf))):p.buf;
const EQF=[{t:'lowshelf',f:120},{t:'peaking',f:600},{t:'peaking',f:2500},{t:'highshelf',f:8000}];
const typeOf=(p,k)=>p.eqt[k]==='bell'?'peaking':(k<2?'lowshelf':'highshelf');
let an=null;
function analyser(){if(!an){an=ac().createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=.8;const cp=ac().createDynamicsCompressor();cp.threshold.value=-8;cp.knee.value=8;cp.ratio.value=10;cp.attack.value=.003;cp.release.value=.2;an.connect(cp);cp.connect(ac().destination)}return an}
const held=new Map();
function peaks(p){if(p.pk)return p.pk;const d=p.buf.getChannelData(0),N=48,step=Math.floor(d.length/N)||1,a=[];let mx=0;
  for(let k=0;k<N;k++){let m=0;for(let j=0;j<step;j+=Math.max(1,step>>6)){const v=Math.abs(d[k*step+j]||0);if(v>m)m=v}a.push(m);if(m>mx)mx=m}
  return p.pk=a.map(v=>mx?v/mx:0)}
function thumb(i){const p=pads[i],c=els[i]&&els[i].querySelector('.wf');if(!p||!c)return;
  const d=devicePixelRatio||1,w=Math.round(c.clientWidth*d),h=Math.round(c.clientHeight*d);if(!w)return;
  c.width=w;c.height=h;const g=c.getContext('2d'),pk=peaks(p),n=pk.length,bw=w/n;
  for(let k=0;k<n;k++){const f=k/n,v=pk[p.reverse?n-1-k:k],bh=Math.max(2*d,v*h);
    g.fillStyle=(f>=p.start&&f<=p.end)?'#fff':'rgba(255,255,255,.35)';
    g.fillRect(k*bw+bw*.15,(h-bh)/2,bw*.7,bh)}}
window.addEventListener('resize',()=>els.forEach((_,k)=>thumb(k)));
function headSec(i){const a=active[i],p=pads[i];if(!a||!p)return -1;
  const dur=curBuf(p).duration,s=p.start*dur,e=p.end*dur;
  let x=a.p0+(ctx.currentTime-a.t0)*a.rate;
  if(p.loop){const L=Math.max(.01,e-s);x=x<s?s:s+((x-s)%L)}else x=Math.min(x,e);
  return x}
let hraf=0;
let mraf=0,lvl=0;
const mini=$('#mini');
function miniLoop(){
  const d0=devicePixelRatio||1,W0=Math.round(mini.clientWidth*d0),H0=Math.round(mini.clientHeight*d0);
  if(mini.width!==W0||mini.height!==H0){mini.width=W0;mini.height=H0}
  const g=mini.getContext('2d'),W=mini.width,H=mini.height,on=Object.keys(active).length>0||MAP.on;
  let t=0;
  if(on){const A=analyser(),buf=new Float32Array(512);A.getFloatTimeDomainData(buf);let s=0;for(let k=0;k<512;k++)s+=buf[k]*buf[k];t=Math.min(1,Math.sqrt(s/512)*5)}
  lvl=lvl*.8+t*.2;
  g.clearRect(0,0,W,H);
  if(!on&&lvl<.03){mraf=0;lvl=0;return}
  const col=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim(),ph=performance.now()/140;
  g.strokeStyle=col;g.lineWidth=2*d0;g.lineCap='round';g.beginPath();
  for(let x=0;x<=W;x+=2){const u=x/W,env=Math.sin(Math.PI*u),y=H/2+env*(H/2-d0)*(.2+.8*lvl)*Math.sin(u*16-ph)*(.6+.4*Math.sin(u*5+ph*.5));x?g.lineTo(x,y):g.moveTo(x,y)}
  g.stroke();
  mraf=requestAnimationFrame(miniLoop)}
function headLoop(){
  if(!sheet.classList.contains('open')||$('#tabSom').hidden||sel<0){hraf=0;return}
  const x=headSec(sel),h=$('#head');
  if(x<0)h.style.display='none';else{h.style.display='block';h.style.left=(x/curBuf(pads[sel]).duration*100)+'%'}
  hraf=requestAnimationFrame(headLoop)}
function fitSheet(){document.documentElement.style.setProperty('--sheet-h',(sheet.classList.contains('open')?sheet.offsetHeight:0)+'px')}
window.addEventListener('resize',fitSheet);

function stopPad(i){const a=active[i];if(!a)return;try{a.src.onended=null;a.src.stop()}catch(e){}delete active[i];els[i].classList.remove('on')}
function playPad(i){
  const p=pads[i];if(!p)return;
  
  stopPad(i);
  const c=ac(),b=curBuf(p),src=c.createBufferSource(),g=c.createGain();
  src.buffer=b;src.playbackRate.value=p.rate;g.gain.value=p.vol;
  const s=p.start*b.duration,e=p.end*b.duration;
  if(p.loop){src.loop=true;src.loopStart=s;src.loopEnd=e;src.start(0,s)}else src.start(0,s,Math.max(.02,e-s));
  const eq=EQF.map((f,k)=>{const b=c.createBiquadFilter();b.type=typeOf(p,k);b.frequency.value=p.eqf[k];b.Q.value=p.eqq[k];b.gain.value=p.eqo[k]?p.eq[k]:0;return b});
  let nd=src.connect(g);eq.forEach(b=>{nd=nd.connect(b)});nd.connect(analyser());
  active[i]={src,g,eq,p0:s,t0:c.currentTime,rate:p.rate};els[i].classList.add('on');if(!mraf)miniLoop();
  src.onended=()=>{if(active[i]&&active[i].src===src){delete active[i];els[i].classList.remove('on')}};
}
function live(i){const a=active[i],p=pads[i];if(!a||!p)return;
  if(a.rate!==p.rate){a.p0=headSec(i);a.t0=ctx.currentTime;a.rate=p.rate}
  a.g.gain.value=p.vol;a.src.playbackRate.value=p.rate;a.eq.forEach((b,k)=>{b.type=typeOf(p,k);b.gain.value=p.eqo[k]?p.eq[k]:0;b.frequency.value=p.eqf[k];b.Q.value=p.eqq[k]});
  if(p.loop){const d=curBuf(p).duration;a.src.loopStart=p.start*d;a.src.loopEnd=p.end*d}}

/* ---------- recording ---------- */
async function startRec(i){
  ac();
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
  catch(e){say('Sem acesso ao microfone. Autoriza o microfone nas definições do navegador.');return}
  const mr=new MediaRecorder(stream),chunks=[];
  rec={i,mr,t0:performance.now()};
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=async()=>{
    clearInterval(rec.tick);clearTimeout(rec.cut);stream.getTracks().forEach(t=>t.stop());
    const idx=rec.i;rec=null;els[idx].classList.remove('rec');
    try{stopPad(idx);pads[idx]=await makePad(new Blob(chunks,{type:mr.mimeType}));dbPut(idx);say('Guardado. Toca outra vez para gravar por cima, ou muda para Tocar.')}
    catch(e){say('Não consegui ler esta gravação. Tenta outra vez.')}
    render(idx);};
  mr.start();
  els[i].classList.add('rec');
  rec.tick=setInterval(()=>{const t=(performance.now()-rec.t0)/1000;els[i].innerHTML='<span>A gravar</span><small>'+fmt(t)+' / '+MAX+' s</small>'},100);
  rec.cut=setTimeout(()=>stopRec(),MAX*1000);
  say('A gravar… toca no quadrado para parar.');
}
function stopRec(){if(rec&&rec.mr.state!=='inactive')rec.mr.stop()}

/* ---------- grid ---------- */
function render(i){const el=els[i],p=pads[i];
  el.classList.toggle('full',!!p);el.classList.toggle('sel',i===sel);
  el.innerHTML=p?'<canvas class="wf"></canvas><small>'+fmt(p.buf.duration)+(p.latch?'':' (manter)')+'</small>':'<span>vazio</span>';if(p)thumb(i);}
for(let i=0;i<N;i++){
  const b=document.createElement('button');b.className='pad';b.style.setProperty('--h',(i*30+160)%360);
  b.setAttribute('aria-label','Quadrado '+(i+1));
  b.addEventListener('pointerdown',e=>{if(mode==='edit')return;e.preventDefault();tap(i,e.pointerId)});

function synth(i){

  if(i===9){[523,659,784,1047].forEach((f,k)=>note(f,k*.45,.5,.4));return d}
  if(i===11){[0,.35].forEach(t0=>{for(let k=Math.floor(t0*sr);k<Math.min(n,Math.floor((t0+.25)*sr));k++){const t=k/sr-t0;d[k]+=Math.sin(T*60*t)*Math.exp(-14*t)}});return d}
  if(i===7){for(let b=0;b<9;b++){const t0=Math.random()*(dur-.3);for(let k=Math.floor(t0*sr);k<Math.min(n,Math.floor((t0+.18)*sr));k++){const t=k/sr-t0;d[k]+=.5*Math.sin(T*(700+900*t*3)*t)*Math.exp(-18*t)}}return d}

    else if(i===3){v=Math.sin(T*55*t)+.4*Math.sin(T*110*t);v*=Math.min(1,t*40)*Math.exp(-2.2*t)}

  MAP.fingers.forEach(f=>{if(f.grab>=0)return;const n=nearest(f.x,f.y,34,W,H);
    if(f.hi>=0&&n!==f.hi)unhold(f);
    if(f.hi<0&&n>=0){f.hi=n;f.ht=now}
    else if(f.hi>=0){const t=now-f.ht;if(t>=150)MAP.dots[f.hi].classList.add('hold');
      if(t>=1000){const k=f.hi;unhold(f);f.grab=k;MAP.dots[k].classList.add('grab');if(navigator.vibrate)navigator.vibrate(30)}}});
  const sg=.2*Math.min(W,H),fl=[...MAP.fingers.values()],gs=new Set([...MAP.fingers.values()].filter(f=>f.grab>=0).map(f=>f.grab)),tg=[];let tot=0;
  pads.forEach((p,i)=>{if(!MAP.nodes[i])return;const px=(p.mx*.5+.5)*W,py=(p.my*.5+.5)*H;let t=0;
    fl.forEach(f=>{t=Math.max(t,Math.exp(-Math.pow(Math.hypot(f.x-px,f.y-py)/sg,2)))});if(gs.has(i))t=1;tg[i]=t<.03?0:t;tot+=tg[i]});
  const k=tot>1.2?1.2/tot:1,tm=ac().currentTime;
  pads.forEach((p,i)=>{const n=MAP.nodes[i];if(!n)return;const tt=tg[i]*k;n.lv=n.lv||0;n.lv+=(tt-n.lv)*(tt>n.lv?.3:(fl.length?.12:.025));if(tt===0&&n.lv<.001)n.lv=0;n.mg.gain.setTargetAtTime(n.lv*.9,tm,.03);
    const e=MAP.dots[i];if(e){e.style.left=((p.mx*.5+.5)*W)+'px';e.style.top=((p.my*.5+.5)*H)+'px';e.classList.toggle('lit',n.lv>.08);
      e.style.transform='scale('+((1+n.lv*.45)*(e.classList.contains('grab')?1.2:1))+')'}});
  MAP.fingers.forEach(f=>{f.el.style.left=f.x+'px';f.el.style.top=f.y+'px'});
  MAP.raf=requestAnimationFrame(mapLoop)}
function mapMode(on){
  document.body.classList.toggle('maping',on);
  if(on){Object.keys(active).forEach(stopPad);ac();MAP.on=true;
    pads.forEach((p,i)=>{if(p)try{mapStart(i)}catch(e){}});buildDots();
    if(!MAP.raf)mapLoop();if(!mraf)miniLoop();
    say('Arrasta o dedo pelo mapa. Mantém 1 s sobre um som para o mover.')}
  else{MAP.on=false;mapStop();MAP.fingers.forEach(f=>f.el.remove());MAP.fingers.clear()}}
document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',()=>{const on=b.dataset.m==='map';if(on!==MAP.on)mapMode(on)}));
</script>
